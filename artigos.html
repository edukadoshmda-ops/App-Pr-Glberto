    <style>
      /* Page-specific overrides: reduce visual scale on Artigos page */
      .stats-grid .stat-card {
        padding: 12px 12px 12px;
        min-height: 84px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.14);
      }
      .stats-grid .stat-card::before {
        width: 70px;
        height: 70px;
        inset: auto auto -18px -12px;
      }
      .stats-grid .stat-card span { font-size: 10px; margin-bottom: 8px; }
      .stats-grid .stat-card strong { font-size: clamp(20px, 2.2vw, 28px); margin-bottom: 6px; }

      /* Slightly smaller article cards and thumbnails */
      .cards-grid .media-card { padding: 12px; border-radius: 12px; position: relative; }
      .cards-grid .media-thumb { height: 96px; background-size: contain !important; background-position: center center !important; }
      .cards-grid .media-body h3 { font-size: 16px; }
      .cards-grid .media-body p { font-size: 13px; }

      /* Delete button */
      .delete-article-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(220, 53, 69, 0.92);
        border: none;
        color: white;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.2s;
        z-index: 10;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      }
      .delete-article-btn:hover {
        background: rgb(200, 35, 51);
        transform: scale(1.12);
        box-shadow: 0 4px 12px rgba(220,53,69,0.5);
      }

      @media (max-width: 980px) {
        .stats-grid .stat-card { min-height: 72px; padding: 10px; }
        .cards-grid .media-thumb { height: 84px; }
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="script.js"></script>
    <script>
        // ── Estado global de artigos ──────────────────────────────
        let allArticles = [];

        // ── Carrega artigos da API ────────────────────────────────
        async function loadArticles() {
            try {
                const client = getSupabaseClient();
                if (client) {
                    const { data: articles, error } = await client.from('articles').select('*').order('created_at', { ascending: false });
                    if (error) throw error;
                    allArticles = articles.map(a => ({
                        id: a.id,
                        title: a.title,
                        category: a.category,
                        author: a.author,
                        createdAt: a.created_at,
                        imagePath: a.image_url || null,
                        coverUrl: a.image_url || null,
                        pdfPath: a.pdf_url,
                        contentUrl: a.pdf_url,
                        description: a.description,
                        content: a.content,
                        views: a.views_count
                    }));
                } else {
                    try {
                        const res = await fetch('/api/articles');
                        if (res.ok) allArticles = await res.json();
                    } catch(e) {
                        // tenta outras portas
                        try {
                            const res2 = await fetch('http://localhost:5000/api/articles');
                            if (res2.ok) allArticles = await res2.json();
                        } catch(e2) {
                            try {
                                const res3 = await fetch('http://localhost:3000/api/articles');
                                if (res3.ok) allArticles = await res3.json();
                            } catch(e3) { /* sem servidor */ }
                        }
                    }
                }

                // Complementar com itens salvos localmente (deduplicando por título)
                try {
                    let localItems = JSON.parse(localStorage.getItem('prgilbertopenido_articles') || '[]');

                    // Deduplicar por título (mantém o mais recente de cada título)
                    const seenTitles = new Map();
                    localItems.forEach(item => {
                        const key = (item.title || '').toLowerCase().trim();
                        if (!seenTitles.has(key) || item.id > seenTitles.get(key).id) {
                            seenTitles.set(key, item);
                        }
                    });
                    localItems = Array.from(seenTitles.values());
                    // Salva versão deduplicada de volta
                    localStorage.setItem('prgilbertopenido_articles', JSON.stringify(localItems));

                    if (localItems.length > 0) {
                        const existingIds = new Set(allArticles.map(a => String(a.id)));
                        const existingTitles = new Set(allArticles.map(a => (a.title || '').toLowerCase().trim()));
                        const localMapped = localItems
                            .filter(item => !existingIds.has(String(item.id)) && !existingTitles.has((item.title || '').toLowerCase().trim()))
                            .map(item => ({
                                id: item.id,
                                title: item.title,
                                category: item.category,
                                author: item.author || 'Pr. Gilberto Penido Bertho',
                                createdAt: item.createdAt,
                                pdfPath: item.contentUrl,
                                contentUrl: item.contentUrl,
                                coverUrl: item.coverUrl,
                                description: item.description || 'Artigo disponível para leitura'
                            }));
                        allArticles = [...allArticles, ...localMapped];
                    }
                } catch(e) {}

                // Filtrar itens deletados (Vercel bypass)
                try {
                    const deletedIds = JSON.parse(localStorage.getItem('prgilbertopenido_deleted') || '[]');
                    if (deletedIds.length > 0) {
                        allArticles = allArticles.filter(a => !deletedIds.includes(String(a.id)));
                    }
                } catch(e) {}

                displayArticles(allArticles);
            } catch (err) {
                console.error('Erro ao carregar artigos:', err);
                displayArticles([]);
            }
        }

        function displayArticles(articles) {
            const grid = document.getElementById('articlesGrid');

            if (articles.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding: 60px 20px;">
                        <i class="fas fa-file-alt" style="font-size:48px; color:var(--gold); opacity:.4; margin-bottom:16px; display:block;"></i>
                        <p style="color: #b8c5d6; font-size:15px;">Nenhum artigo disponível no momento</p>
                    </div>`;
                return;
            }

            function getDriveThumbnail(url) {
                if (!url) return null;
                const match = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
                // Não retorna thumbnail para pastas, apenas arquivos
                if (match && !url.includes('/folders/')) {
                    return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
                }
                return null;
            }

            const isAdmin = (window.AppPermissions && typeof window.AppPermissions.isUserAdmin === 'function') 
                ? window.AppPermissions.isUserAdmin() 
                : (localStorage.getItem('isAdmin') === 'true');

            grid.innerHTML = articles.map((article, index) => {
                const pdfUrl = article.pdfPath || article.contentUrl || '';
                
                // Tenta usar a capa definida. Se não tiver, tenta extrair a miniatura do PDF no Drive
                let finalCover = article.coverUrl;
                if (!finalCover || (!finalCover.startsWith('http') && !finalCover.startsWith('data:'))) {
                    finalCover = getDriveThumbnail(pdfUrl);
                }

                const hasValidCover = finalCover && (finalCover.startsWith('http') || finalCover.startsWith('data:'));
                const isFolder = pdfUrl.includes('/folders/');
                const fallbackIcon = isFolder ? 'fa-folder-open' : 'fa-file-pdf';
                
                const thumbStyle = hasValidCover
                    ? `background: url('${escapeHtml(finalCover)}') center/cover no-repeat;`
                    : `background: linear-gradient(135deg, rgba(13,24,52,0.8) 0%, rgba(30,50,90,0.8) 100%); display:flex; align-items:center; justify-content:center;`;
                const thumbContent = hasValidCover ? '' : `<i class="fas ${fallbackIcon}" style="font-size:42px; color:var(--gold); opacity:0.8;"></i>`;

                return `
                <article class="media-card" style="cursor:pointer;" onclick="openArticle('${article.id}', ${index})">
                    ${isAdmin ? `
                    <button class="delete-article-btn" onclick="event.stopPropagation(); deleteArticle('${article.id}')" title="Remover artigo">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                    ` : ''}
                    <div class="media-thumb" style="${thumbStyle}">${thumbContent}</div>
                    <div class="media-body">
                        <div class="title-row">
                            <h3>${escapeHtml(article.title || 'Sem título')}</h3>
                            <span class="tag tag-gold">${escapeHtml(article.category || 'Artigo')}</span>
                        </div>
                        <p>${escapeHtml(article.description || 'Artigo disponível para leitura')}</p>
                        <button class="secondary-btn" onclick="event.stopPropagation(); openArticle('${article.id}', ${index})">
                            <i class="fas fa-book-open" style="margin-right:6px;"></i>Ler Artigo
                        </button>
                    </div>
                </article>`;
            }).join('');
        }

        function deleteArticle(id) {
            if (!confirm('Deseja remover este artigo?')) return;

            // Remove do localStorage
            try {
                let local = JSON.parse(localStorage.getItem('prgilbertopenido_articles') || '[]');
                local = local.filter(a => String(a.id) !== String(id));
                localStorage.setItem('prgilbertopenido_articles', JSON.stringify(local));
            } catch(e) {}

            // Remove do Supabase se disponível
            try {
                const client = (typeof getSupabaseClient === 'function') ? getSupabaseClient() : null;
                if (client) client.from('articles').delete().eq('id', id).then(() => {});
            } catch(e) {}

            // Marcar como deletado globalmente (para Vercel Read-Only)
            try {
                let deletedIds = JSON.parse(localStorage.getItem('prgilbertopenido_deleted') || '[]');
                if (!deletedIds.includes(String(id))) {
                    deletedIds.push(String(id));
                    localStorage.setItem('prgilbertopenido_deleted', JSON.stringify(deletedIds));
                }
            } catch(e) {}

            // Atualiza lista em memória e re-renderiza
            allArticles = allArticles.filter(a => String(a.id) !== String(id));
            displayArticles(allArticles);
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Busca ─────────────────────────────────────────────────
        function toggleSearch() {
            const container = document.getElementById('searchContainer');
            const isHidden = container.style.display === 'none' || !container.style.display;
            container.style.display = isHidden ? 'block' : 'none';
            if (isHidden) document.getElementById('searchInput').focus();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('searchInput');
            if (input) {
                input.addEventListener('input', () => {
                    const q = input.value.toLowerCase();
                    const filtered = allArticles.filter(a =>
                        (a.title || '').toLowerCase().includes(q) ||
                        (a.category || '').toLowerCase().includes(q) ||
                        (a.description || '').toLowerCase().includes(q)
                    );
                    displayArticles(filtered);
                });
            }
        });

        // ── Modal de leitura ──────────────────────────────────────
        function convertToEmbedUrl(url) {
            if (!url) return null;
            
            // Google Drive Folders: /folders/{id}
            const folderMatch = url.match(/drive\.google\.com\/.*folders\/([a-zA-Z0-9_-]+)/);
            if (folderMatch) return `https://drive.google.com/embeddedfolderview?id=${folderMatch[1]}#grid`;

            // Google Drive: /file/d/{id}/view ou /file/d/{id}/edit → /file/d/{id}/preview
            const driveMatch = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (driveMatch) return `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
            
            // Google Drive por parâmetro id=...
            const idMatch = url.match(/id=([a-zA-Z0-9_-]+)/);
            if (idMatch && url.includes('drive.google.com')) return `https://drive.google.com/file/d/${idMatch[1]}/preview`;

            // Google Docs
            const docsMatch = url.match(/docs\.google\.com\/(document|spreadsheets|presentation)\/d\/([a-zA-Z0-9_-]+)/);
            if (docsMatch) return url.replace(/\/(edit|view|pub).*$/, '/preview');
            
            return url;
        }

        async function openArticle(articleId, articleIndex = 0) {
            const article = allArticles.find(a => String(a.id) === String(articleId));
            if (!article) return;

            // Verificar se o usuário tem permissão (degustação: 1 artigo liberado)
            if (window.AppPermissions && typeof window.AppPermissions.checkItemAccess === 'function') {
                if (!window.AppPermissions.checkItemAccess('artigos', articleId, articleIndex)) {
                    return;
                }
            }

            const modal = document.getElementById('articleModal');
            document.getElementById('modalTitle').textContent = article.title || 'Artigo';
            document.getElementById('modalCategory').textContent = article.category || 'Artigo';
            document.getElementById('modalDate').textContent = article.createdAt
                ? new Date(article.createdAt).toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' })
                : '';

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const rawUrl = article.pdfPath || article.contentUrl;
            
            // Se for PDF ou URL externa, tenta usar o leitor do PDF.js primeiro
            if (rawUrl && (rawUrl.toLowerCase().endsWith('.pdf') || rawUrl.startsWith('http'))) {
                const isGoogleDrive = rawUrl.includes('drive.google.com');
                const pdfUrl = convertToEmbedUrl(rawUrl);

                if (typeof books !== 'undefined' && typeof openBookViewer === 'function') {
                    const bookId = 'dynamic_art_' + Date.now();
                    books[bookId] = { title: article.title, files: [rawUrl] };
                    try {
                        await openBookViewer(bookId);
                        return; // Abriu com sucesso no PDF.js (tela cheia), não precisa do modal
                    } catch (err) {
                        console.warn('PDF.js falhou, abrindo via iframe:', err.message || err);
                    }
                }

                // Fallback: abre no Iframe do modal
                const isLocal = rawUrl.startsWith('file://');
                if (isLocal) {
                    body.innerHTML = `
                        <div style="text-align:center; padding:48px 20px;">
                            <i class="fas fa-file-pdf" style="font-size:56px; color:var(--gold); display:block; margin-bottom:20px; opacity:0.85;"></i>
                            <h3 style="color:#fff; margin-bottom:8px;">${escapeHtml(article.title)}</h3>
                            <p style="color:#b8c5d6; margin-bottom:24px; font-size:14px;">Arquivo local — clique abaixo para abrir no seu leitor de PDF.</p>
                            <a href="${escapeHtml(rawUrl)}" target="_blank" rel="noopener"
                               style="display:inline-flex;align-items:center;gap:10px;padding:14px 28px;background:var(--gold);color:#0d1834;border-radius:10px;font-weight:700;text-decoration:none;font-size:15px;">
                                <i class="fas fa-external-link-alt"></i> Abrir PDF
                            </a>
                        </div>`;
                } else {
                    body.innerHTML = `
                        <div style="position:relative;width:100%;height:72vh;">
                            <iframe id="articleIframe"
                                src="${escapeHtml(pdfUrl)}"
                                style="width:100%;height:100%;border:none;border-radius:10px;background:#fff;"
                                title="${escapeHtml(article.title)}"
                                allow="autoplay">
                            </iframe>
                            <div style="text-align:center;margin-top:12px;display:flex;justify-content:center;gap:12px;">
                                <a href="${escapeHtml(isGoogleDrive ? rawUrl.replace('/preview', '/view') : rawUrl)}" target="_blank" rel="noopener"
                                   style="display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:rgba(212,175,55,0.15);border:1px solid rgba(212,175,55,0.3);color:var(--gold);border-radius:8px;text-decoration:none;font-size:13px;font-weight:600;">
                                    <i class="fas fa-external-link-alt"></i> Abrir em nova aba
                                </a>
                            </div>
                        </div>`;
                }
            } else if (article.content) {
                body.innerHTML = `<div class="article-reader-body">${article.content}</div>`;
            } else {
                body.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;">
                        <i class="fas fa-file-alt" style="font-size:48px;color:var(--gold);opacity:.5;display:block;margin-bottom:12px;"></i>
                        <p style="color:#b8c5d6;">Conteúdo do artigo não disponível.</p>
                    </div>`;
            }

            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeArticleModal() {
            const modal = document.getElementById('articleModal');
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }

        // Fechar com Esc
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeArticleModal();
        });

        // Carrega ao iniciar
        loadArticles();
    </script>

    <!-- ── Modal de Leitura de Artigo ── -->

                    <i class="fas fa-times"></i>
                </button>
            </div>

        </div>
    </div>

    <style>
        /* ── Modal de Artigo ───────────────────────────────────── */
        .article-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(4, 8, 22, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: modalFadeIn .25s ease;
        }
        .article-modal-overlay.open {
            display: flex;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .article-modal-box {
            background: linear-gradient(145deg, rgba(13,24,52,0.98), rgba(6,12,30,0.99));
            border: 1px solid rgba(212,175,55,.25);
            border-radius: 22px;
            width: 100%;
            max-width: 860px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
            animation: modalSlideUp .3s cubic-bezier(.34,1.56,.64,1);
            overflow: hidden;
        }
        @keyframes modalSlideUp {
            from { transform: translateY(32px) scale(.97); opacity: 0; }
            to   { transform: none; opacity: 1; }
        }
        .article-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 28px 32px 20px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .article-modal-close {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b8c5d6;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .2s, color .2s;
        }
        .article-modal-close:hover {
            background: rgba(212,175,55,.15);
            color: var(--gold);
        }
        .article-modal-body {
            overflow-y: auto;
            padding: 28px 32px;
            flex: 1;
        }
        .article-reader-body {
            color: #d0d8e8;
            font-size: 15px;
            line-height: 1.85;
        }
        .article-reader-body h1,
        .article-reader-body h2,
        .article-reader-body h3 {
            color: #fff;
            margin: 24px 0 12px;
        }
        .article-reader-body p { margin-bottom: 16px; }
        .article-reader-body blockquote {
            border-left: 3px solid var(--gold);
            padding: 10px 16px;
            background: rgba(212,175,55,.06);
            border-radius: 6px;
            margin: 20px 0;
            color: #c8d4e8;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .article-modal-header { padding: 20px; }
            .article-modal-body  { padding: 16px 20px; }
            .article-modal-box   { border-radius: 16px; }
        }
    </style>
    <script src="global-theme.js"></script>
</body>

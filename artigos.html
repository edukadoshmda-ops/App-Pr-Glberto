<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigos - EliteFlow</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
      /* Page-specific overrides: reduce visual scale on Artigos page */
      .stats-grid .stat-card {
        padding: 12px 12px 12px;
        min-height: 84px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.14);
      }
      .stats-grid .stat-card::before {
        width: 70px;
        height: 70px;
        inset: auto auto -18px -12px;
      }
      .stats-grid .stat-card span { font-size: 10px; margin-bottom: 8px; }
      .stats-grid .stat-card strong { font-size: clamp(20px, 2.2vw, 28px); margin-bottom: 6px; }

      /* Slightly smaller article cards and thumbnails */
      .cards-grid .media-card { padding: 12px; border-radius: 12px; }
      .cards-grid .media-thumb { height: 96px; background-size: contain !important; background-position: center center !important; }
      .cards-grid .media-body h3 { font-size: 16px; }
      .cards-grid .media-body p { font-size: 13px; }

      @media (max-width: 980px) {
        .stats-grid .stat-card { min-height: 72px; padding: 10px; }
        .cards-grid .media-thumb { height: 84px; }
      }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand-block">
                <img class="brand-logo" src="assets/logo.png" alt="EliteFlow logo" />
            </div>

            <button class="mobile-back-btn" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i>
                <span>Voltar</span>
            </button>

            <nav class="menu">
                <a href="dashboard.html" class="menu-item">
                    <i class="fas fa-home"></i>
                    <span>Dashboard</span>
                </a>
                <a href="audiobook.html" class="menu-item">
                    <i class="fas fa-headphones"></i>
                    <span>Audio Book</span>
                </a>
                <a href="play-books.html" class="menu-item">
                    <i class="fas fa-book-open"></i>
                    <span>Play Books</span>
                </a>
                <a href="videos.html" class="menu-item">
                    <i class="fas fa-video"></i>
                    <span>Vídeos</span>
                </a>
                <a href="artigos.html" class="menu-item active">
                    <i class="fas fa-file-alt"></i>
                    <span>Artigos</span>
                </a>
                <a href="relatorios.html" class="menu-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Relatórios</span>
                </a>
                <a href="usuarios.html" class="menu-item">
                    <i class="fas fa-users"></i>
                    <span>Usuários</span>
                </a>
                <a href="criar.html" class="menu-item">
                    <i class="fas fa-plus-circle"></i>
                    <span>Criar</span>
                </a>
            </nav>

            <div class="sidebar-footer">
              <button class="logout-btn" onclick="logout()" title="Sair da aplicação">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sair</span>
              </button>
            </div>
        </aside>

        <!-- Main Panel -->
        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Conteúdo escrito</p>
                    <h1>Artigos</h1>
                </div>
            </header>

            <!-- Search Bar -->
            <div class="search-container" id="searchContainer" style="display: none;">
                <input type="text" placeholder="Buscar artigos..." class="search-input" id="searchInput">
            </div>

            <section class="cards-grid" id="articlesGrid">
                <!-- Artigos serão carregados dinamicamente -->
            </section>
        </main>
    </div>

    <script src="script.js"></script>
    <script>
        // ── Estado global de artigos ──────────────────────────────
        let allArticles = [];

        // ── Carrega artigos da API ────────────────────────────────
        async function loadArticles() {
            try {
                const res = await fetch('/api/articles');
                if (!res.ok) return;
                allArticles = await res.json();
                displayArticles(allArticles);
            } catch (err) {
                console.error('Erro ao carregar artigos:', err);
                displayArticles([]);
            }
        }

        function displayArticles(articles) {
            const grid = document.getElementById('articlesGrid');

            if (articles.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding: 60px 20px;">
                        <i class="fas fa-file-alt" style="font-size:48px; color:var(--gold); opacity:.4; margin-bottom:16px; display:block;"></i>
                        <p style="color: #b8c5d6; font-size:15px;">Nenhum artigo disponível no momento</p>
                    </div>`;
                return;
            }

            grid.innerHTML = articles.map(article => `
                <article class="media-card" style="cursor:pointer;" onclick="openArticle('${article.id}')">
                    <div class="media-thumb" style="background: url('${escapeHtml(article.coverPath || 'assets/playbooks/capas/lideranca-crista.jpg')}') center/contain no-repeat;"></div>
                    <div class="media-body">
                        <div class="title-row">
                            <h3>${escapeHtml(article.title || 'Sem título')}</h3>
                            <span class="tag tag-gold">${escapeHtml(article.category || 'Artigo')}</span>
                        </div>
                        <p>${escapeHtml(article.description || 'Artigo disponível para leitura')}</p>
                        <button class="secondary-btn" onclick="event.stopPropagation(); openArticle('${article.id}')">
                            <i class="fas fa-book-open" style="margin-right:6px;"></i>Ler Artigo
                        </button>
                    </div>
                </article>
            `).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ── Busca ─────────────────────────────────────────────────
        function toggleSearch() {
            const container = document.getElementById('searchContainer');
            const isHidden = container.style.display === 'none' || !container.style.display;
            container.style.display = isHidden ? 'block' : 'none';
            if (isHidden) document.getElementById('searchInput').focus();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('searchInput');
            if (input) {
                input.addEventListener('input', () => {
                    const q = input.value.toLowerCase();
                    const filtered = allArticles.filter(a =>
                        (a.title || '').toLowerCase().includes(q) ||
                        (a.category || '').toLowerCase().includes(q) ||
                        (a.description || '').toLowerCase().includes(q)
                    );
                    displayArticles(filtered);
                });
            }
        });

        // ── Modal de leitura ──────────────────────────────────────
        async function openArticle(articleId) {
            const article = allArticles.find(a => String(a.id) === String(articleId));
            if (!article) return;

            const modal = document.getElementById('articleModal');
            document.getElementById('modalTitle').textContent = article.title || 'Artigo';
            document.getElementById('modalCategory').textContent = article.category || 'Artigo';
            document.getElementById('modalDate').textContent = article.createdAt
                ? new Date(article.createdAt).toLocaleDateString('pt-BR', { day:'2-digit', month:'long', year:'numeric' })
                : '';

            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            if (article.pdfPath) {
                // Exibe PDF embutido
                body.innerHTML = `
                    <iframe
                        src="${escapeHtml(article.pdfPath)}"
                        style="width:100%;height:72vh;border:none;border-radius:10px;"
                        title="${escapeHtml(article.title)}">
                    </iframe>`;
            } else if (article.content) {
                // Exibe conteúdo HTML/texto
                body.innerHTML = `<div class="article-reader-body">${article.content}</div>`;
            } else {
                body.innerHTML = `
                    <div style="text-align:center;padding:60px 20px;">
                        <i class="fas fa-file-alt" style="font-size:48px;color:var(--gold);opacity:.5;display:block;margin-bottom:12px;"></i>
                        <p style="color:#b8c5d6;">Conteúdo do artigo não disponível.</p>
                    </div>`;
            }

            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeArticleModal() {
            const modal = document.getElementById('articleModal');
            modal.classList.remove('open');
            document.body.style.overflow = '';
        }

        // Fechar com Esc
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeArticleModal();
        });

        // Carrega ao iniciar
        loadArticles();
    </script>

    <!-- ── Modal de Leitura de Artigo ── -->
    <div id="articleModal" class="article-modal-overlay" onclick="if(event.target===this)closeArticleModal()">
        <div class="article-modal-box">
            <div class="article-modal-header">
                <div>
                    <span class="tag tag-gold" id="modalCategory" style="margin-bottom:8px;display:inline-block;"></span>
                    <h2 id="modalTitle" style="margin:0;font-size:clamp(18px,2.2vw,24px);color:#fff;font-weight:700;"></h2>
                    <p id="modalDate" style="margin:4px 0 0;color:var(--text-soft);font-size:13px;"></p>
                </div>
                <button class="article-modal-close" onclick="closeArticleModal()" title="Fechar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="article-modal-body" id="modalBody"></div>
        </div>
    </div>

    <style>
        /* ── Modal de Artigo ───────────────────────────────────── */
        .article-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(4, 8, 22, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            align-items: center;
            justify-content: center;
            padding: 24px;
            animation: modalFadeIn .25s ease;
        }
        .article-modal-overlay.open {
            display: flex;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }
        .article-modal-box {
            background: linear-gradient(145deg, rgba(13,24,52,0.98), rgba(6,12,30,0.99));
            border: 1px solid rgba(212,175,55,.25);
            border-radius: 22px;
            width: 100%;
            max-width: 860px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 32px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
            animation: modalSlideUp .3s cubic-bezier(.34,1.56,.64,1);
            overflow: hidden;
        }
        @keyframes modalSlideUp {
            from { transform: translateY(32px) scale(.97); opacity: 0; }
            to   { transform: none; opacity: 1; }
        }
        .article-modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            padding: 28px 32px 20px;
            border-bottom: 1px solid rgba(255,255,255,.06);
        }
        .article-modal-close {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #b8c5d6;
            cursor: pointer;
            flex-shrink: 0;
            transition: background .2s, color .2s;
        }
        .article-modal-close:hover {
            background: rgba(212,175,55,.15);
            color: var(--gold);
        }
        .article-modal-body {
            overflow-y: auto;
            padding: 28px 32px;
            flex: 1;
        }
        .article-reader-body {
            color: #d0d8e8;
            font-size: 15px;
            line-height: 1.85;
        }
        .article-reader-body h1,
        .article-reader-body h2,
        .article-reader-body h3 {
            color: #fff;
            margin: 24px 0 12px;
        }
        .article-reader-body p { margin-bottom: 16px; }
        .article-reader-body blockquote {
            border-left: 3px solid var(--gold);
            padding: 10px 16px;
            background: rgba(212,175,55,.06);
            border-radius: 6px;
            margin: 20px 0;
            color: #c8d4e8;
            font-style: italic;
        }
        @media (max-width: 600px) {
            .article-modal-header { padding: 20px; }
            .article-modal-body  { padding: 16px 20px; }
            .article-modal-box   { border-radius: 16px; }
        }
    </style>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta Grátis - PrGilbertoPenido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; }
        .purchase-container { max-width: 700px; margin: 0 auto; padding: 40px 20px; }
        .purchase-header { text-align: center; margin-bottom: 40px; }
        .purchase-header h1 { font-size: 36px; font-weight: 800; color: #ffffff; margin-bottom: 10px; }
        .purchase-header p { font-size: 16px; color: #b8c5d6; }
        .purchase-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 40px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: #ffffff; font-weight: 600; margin-bottom: 8px; }
        .form-group input { width: 100%; padding: 14px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #ffffff; font-size: 16px; }
        .form-group input:focus { outline: none; border-color: #cda451; background: rgba(255,255,255,0.08); }
        .form-group input::placeholder { color: #858f9a; }
        .submit-btn { width: 100%; padding: 18px 32px; background: linear-gradient(135deg, #cda451, #a97a29); color: #ffffff; font-size: 18px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(199,164,81,0.4); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .success-message { background: rgba(37,211,102,0.1); border: 2px solid rgba(37,211,102,0.3); border-radius: 12px; padding: 25px; text-align: center; display: none; }
        .success-message h3 { color: #25D366; font-size: 22px; margin-bottom: 15px; }
        body.theme-light .purchase-header h1 { color: #0f172a !important; }
        body.theme-light .purchase-header p { color: #475569 !important; }
        body.theme-light .purchase-card { background: #ffffff !important; border: 1px solid #e2e8f0 !important; box-shadow: 0 4px 20px rgba(0,0,0,0.06) !important; }
        body.theme-light .form-group label { color: #1e293b !important; }
        body.theme-light .form-group input { background: #ffffff !important; color: #0f172a !important; border: 1px solid #cbd5e1 !important; }
    </style>
    <link rel="stylesheet" href="theme-light-all.css">
    <script src="auth-permissions.js"></script>
</head>
<body>
    <div class="purchase-container">
        <a href="index.html" class="btn-back" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;margin-bottom:20px;padding:8px 16px;border-radius:8px;">
            <i class="fas fa-arrow-left"></i> Voltar ao início
        </a>
        <div class="purchase-header">
            <h1>Crie sua conta grátis</h1>
            <p>Cadastre-se e tenha <strong style="color:#cda451;">acesso total e imediato</strong> a todos os Áudio Books, Play Books, Vídeos e Artigos.</p>
        </div>
        <div class="purchase-card">
            <form id="purchaseForm">
                <div class="form-group"><label for="fullName">Nome Completo</label><input type="text" id="fullName" placeholder="Digite seu nome completo" required></div>
                <div class="form-group"><label for="phone">Telefone (WhatsApp)</label><input type="tel" id="phone" placeholder="(00) 00000-0000" required></div>
                <div class="form-group"><label for="email">E-mail</label><input type="email" id="email" placeholder="seu@email.com" required></div>
                <div class="form-group"><label for="password">Senha</label><input type="password" id="password" placeholder="Crie uma senha" required minlength="6"></div>
                <div class="form-group"><label for="confirmPassword">Confirmar Senha</label><input type="password" id="confirmPassword" placeholder="Confirme sua senha" required minlength="6"></div>
                <button type="submit" class="submit-btn"><i class="fas fa-check-circle"></i> Criar Conta Grátis</button>
            </form>
            <div id="successMessage" class="success-message">
                <h3><i class="fas fa-check-circle"></i> Conta criada!</h3>
                <p>Acesso total liberado para <strong id="userEmailSpan" style="color:#cda451;"></strong></p>
                <a href="login.html" class="submit-btn" style="text-decoration:none;margin-top:16px;"><i class="fas fa-sign-in-alt"></i> Entrar no Aplicativo</a>
            </div>
            <p style="text-align:center;margin-top:16px;color:#b8c5d6;font-size:14px;">Já tem conta? <a href="login.html" style="color:#cda451;font-weight:600;">Fazer login</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script>
        document.getElementById("purchaseForm").addEventListener("submit", async function(e){
            e.preventDefault();
            const fullName=document.getElementById("fullName").value.trim();
            const phone=document.getElementById("phone").value.trim();
            const email=document.getElementById("email").value.trim();
            const password=document.getElementById("password").value.trim();
            const confirmPassword=document.getElementById("confirmPassword").value.trim();
            if(!fullName||!phone||!email||!password){ alert("Por favor, preencha todos os campos!"); return; }
            if(password!==confirmPassword){ alert("As senhas não coincidem!"); return; }
            const btn=this.querySelector(".submit-btn"); btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Criando sua conta...';
            try{
                const r=await fetch("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fullName,phone,email,password})});
                const d=await r.json();
                if(r.ok&&d.success){
                    const u=d.user; localStorage.setItem("isLoggedIn","true"); localStorage.setItem("userEmail",u.email); localStorage.setItem("userId",u.id); localStorage.setItem("userName",u.fullName||email); localStorage.setItem("isAdmin","false"); localStorage.setItem("userStatus","approved"); localStorage.setItem("subscriptionType","full"); localStorage.setItem("userExpiresAt",""); localStorage.setItem("userCreatedAt",u.createdAt||new Date().toISOString()); window.location.href="dashboard.html";
                } else { alert(d.error||"Erro ao criar conta. Tente novamente."); btn.disabled=false; btn.innerHTML='<i class="fas fa-check-circle"></i> Criar Conta Grátis'; }
            }catch(err){ console.error(err); alert("Erro de conexão. Tente novamente."); btn.disabled=false; btn.innerHTML='<i class="fas fa-check-circle"></i> Criar Conta Grátis'; }
        });
        document.getElementById("phone").addEventListener("input",function(e){
            let v=e.target.value.replace(/\D/g,""); if(v.length>11) v=v.slice(0,11);
            if(v.length>0){ v="("+v; if(v.length>3) v=v.slice(0,3)+") "+v.slice(3); if(v.length>10) v=v.slice(0,10)+"-"+v.slice(10); }
            e.target.value=v;
        });
    </script>
    <script src="global-theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Profissional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css" />
      <link rel="stylesheet" href="theme-light-all.css">
    <script src="auth-permissions.js"></script>
</head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <img class="brand-logo" src="assets/logo.png" alt="PrGilbertoPenido logo" />
        </div>

        <button class="mobile-back-btn" onclick="window.location.href='index.html'">
          <i class="fas fa-arrow-left"></i>
          <span>Voltar</span>
        </button>

        <nav class="menu">
          <a href="dashboard.html" class="menu-item">
            <i class="fas fa-home"></i>
            <span>Painel</span>
          </a>
          <a href="audiobook.html" class="menu-item">
            <i class="fas fa-headphones"></i>
            <span>Audio Book</span>
          </a>
          <a href="play-books.html" class="menu-item">
            <i class="fas fa-book-open"></i>
            <span>Play Books</span>
          </a>
          <a href="videos.html" class="menu-item">
            <i class="fas fa-video"></i>
            <span>Vídeos</span>
          </a>
          <a href="artigos.html" class="menu-item">
            <i class="fas fa-file-alt"></i>
            <span>Artigos</span>
          </a>
          <a href="relatorios.html" class="menu-item">
            <i class="fas fa-chart-bar"></i>
            <span>Relatórios</span>
          </a>
          <a href="usuarios.html" class="menu-item">
            <i class="fas fa-users"></i>
            <span>Usuários</span>
          </a>
          <a href="criar.html" class="menu-item">
            <i class="fas fa-plus-circle"></i>
            <span>Criar</span>
          </a>
          <a href="configuracoes.html" class="menu-item active">
            <i class="fas fa-cog"></i>
            <span>Configurações</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <button class="logout-btn" onclick="logout()" title="Sair da aplicação">
            <i class="fas fa-sign-out-alt"></i>
            <span>Sair</span>
          </button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Painel executivo</p>
            <h1>Configurações</h1>
          </div>
        </header>

        
        <section style="margin-top: 24px;">
          <div class="module-card" style="max-width: 600px; margin: 0 auto; background: var(--bg-card, #0a1329); border: 1.5px solid var(--border-gold, #cda451); padding: 36px 28px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3);">
            <h2 style="font-size: 20px; margin-bottom: 24px; color: var(--text-color, #ffffff); font-weight: 700;">Trocar Senha</h2>
            
            <form id="change-password-form" onsubmit="event.preventDefault(); alert('Senha atualizada com sucesso!');">
              <div style="margin-bottom: 20px;">
                <label for="current-password" style="display: block; margin-bottom: 8px; color: var(--text-color, #e2e8f0); font-weight: 600; font-size: 14px;">Senha Atual</label>
                <input type="password" id="current-password" required style="width: 100%; padding: 13px 16px; border-radius: 10px; border: 1.5px solid #f5b52e; background: rgba(8, 17, 38, 0.9); color: #ffffff; font-size: 15px; box-sizing: border-box; outline: none; transition: all 0.3s ease;" placeholder="Digite sua senha atual" />
              </div>

              <div style="margin-bottom: 20px;">
                <label for="new-password" style="display: block; margin-bottom: 8px; color: var(--text-color, #e2e8f0); font-weight: 600; font-size: 14px;">Nova Senha</label>
                <input type="password" id="new-password" required style="width: 100%; padding: 13px 16px; border-radius: 10px; border: 1.5px solid #f5b52e; background: rgba(8, 17, 38, 0.9); color: #ffffff; font-size: 15px; box-sizing: border-box; outline: none; transition: all 0.3s ease;" placeholder="Digite a nova senha" />
              </div>

              <div style="margin-bottom: 30px;">
                <label for="confirm-password" style="display: block; margin-bottom: 8px; color: var(--text-color, #e2e8f0); font-weight: 600; font-size: 14px;">Confirmar Nova Senha</label>
                <input type="password" id="confirm-password" required style="width: 100%; padding: 13px 16px; border-radius: 10px; border: 1.5px solid #f5b52e; background: rgba(8, 17, 38, 0.9); color: #ffffff; font-size: 15px; box-sizing: border-box; outline: none; transition: all 0.3s ease;" placeholder="Confirme a nova senha" />
              </div>

              <button type="submit" style="width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, #f5b52e, #d99a18); color: #0a0f1d; font-size: 16px; font-weight: 800; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; box-shadow: 0 4px 15px rgba(245, 181, 46, 0.35);">
                Atualizar Senha
              </button>
            </form>
          </div>
        </section>

      </main>
    </div>

    <script src="script.js"></script>
      <script src="global-theme.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos - PrGilbertoPenido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
      /* Page inline styles kept minimal — visual overlays handled by global style.css */

      /* Modern form layout for video management */
      .video-management {
        display: grid;
        grid-template-columns: 1fr 420px;
        gap: 28px;
        align-items: start;
      }

      .form-panel {
        background: linear-gradient(145deg, rgba(17,30,61,0.95), rgba(8,16,32,0.92));
        padding: 20px;
        border-radius: 14px;
        border: 1px solid var(--border);
      }

      .form-panel h3 { margin-bottom: 8px; color: var(--white); }
      .form-panel p.lead { color: var(--text-soft); margin-bottom: 14px; }

      .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .input-single { margin-bottom: 12px; }

      .upload-card { display:flex; gap:12px; align-items:center; padding:12px; border-radius:10px; background: rgba(255,255,255,0.02); border:1px dashed rgba(255,255,255,0.04); }
      .upload-card .thumb { width:120px; height:84px; background:#0b1530; border-radius:8px; background-size:cover; background-position:center; flex-shrink:0; }
      .upload-card .meta { color:var(--text-soft); font-size:13px; }

      .recent-panel { background: linear-gradient(145deg, rgba(12,22,44,0.96), rgba(6,12,24,0.96)); padding:16px; border-radius:14px; border:1px solid var(--border); }
      .recent-list { display:flex; flex-direction:column; gap:10px; }
      .recent-item { display:flex; gap:12px; align-items:center; padding:10px; border-radius:10px; background: rgba(255,255,255,0.015); }
      .recent-item .thumb { width:180px; height:117px; background-size:cover; background-position:center; border-radius:8px; }
      .recent-item .info h4 { margin:0 0 4px 0; font-size:14px; }
      .recent-item .info p { margin:0; color:var(--text-soft); font-size:12px; }

      @media (max-width: 980px) {
        .video-management { grid-template-columns: 1fr; }
      }
    </style>
</head>
<body>
    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand-block">
                <img class="brand-logo" src="assets/logo.png" alt="PrGilbertoPenido logo" />
            </div>

            <button class="mobile-back-btn" onclick="window.location.href='index.html'">
                <i class="fas fa-arrow-left"></i>
                <span>Voltar</span>
            </button>

            <nav class="menu">
                <a href="dashboard.html" class="menu-item">
                    <i class="fas fa-home"></i>
                    <span>Painel</span>
                </a>
                <a href="audiobook.html" class="menu-item">
                    <i class="fas fa-headphones"></i>
                    <span>Audio Book</span>
                </a>
                <a href="play-books.html" class="menu-item">
                    <i class="fas fa-book-open"></i>
                    <span>Play Books</span>
                </a>
                <a href="videos.html" class="menu-item active">
                    <i class="fas fa-video"></i>
                    <span>Vídeos</span>
                </a>
                <a href="artigos.html" class="menu-item">
                    <i class="fas fa-file-alt"></i>
                    <span>Artigos</span>
                </a>
                <a href="relatorios.html" class="menu-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Relatórios</span>
                </a>
                <a href="usuarios.html" class="menu-item">
                    <i class="fas fa-users"></i>
                    <span>Usuários</span>
                </a>
                <a href="criar.html" class="menu-item">
                    <i class="fas fa-plus-circle"></i>
                    <span>Criar</span>
                </a>
            </nav>

            <div class="sidebar-footer">
              <button class="logout-btn" onclick="logout()" title="Sair da aplicação">
                <i class="fas fa-sign-out-alt"></i>
                <span>Sair</span>
              </button>
            </div>
        </aside>

        <!-- Main Panel -->
        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Conteúdo em vídeo</p>
                    <h1>Vídeos</h1>
                </div>
            </header>

            <!-- Reformulated Video Management: Modern, concise form + recent list -->
            <section class="video-management">

              <!-- Recent videos -->
              <div class="recent-panel" style="width: 100%;">
                <h3>Vídeos</h3>
                <p class="lead">Vídeos disponíveis</p>

                <div class="recent-list" id="recentList">
                  <!-- Vídeos serão carregados aqui dinamicamente -->
                </div>

              </div>

            </section>


        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="script.js"></script>
    <script>
        // Load videos and populate recent list
        async function loadVideos() {
            try {
                let videos = [];
                
                // 1. Tentar Supabase
                const client = (typeof getSupabaseClient === 'function') ? getSupabaseClient() : null;
                if (client) {
                    const { data, error } = await client.from('videos').select('*').order('created_at', { ascending: false });
                    if (!error && data) {
                        videos = data.map(v => ({
                            id: v.id, title: v.title, category: v.category,
                            author: v.author, youtube_url: v.youtube_url,
                            cover_url: v.cover_url, coverUrl: v.cover_url,
                            contentUrl: v.youtube_url, duration: v.duration
                        }));
                    }
                }
                
                // 2. Tentar API local se Supabase não retornou dados
                if (videos.length === 0) {
                    try {
                        const res = await fetch('/api/videos');
                        if (res.ok) videos = await res.json();
                    } catch(e) {
                        try {
                            const res2 = await fetch('http://localhost:5000/api/videos');
                            if (res2.ok) videos = await res2.json();
                        } catch(e2) {
                            try {
                                const res3 = await fetch('http://localhost:3000/api/videos');
                                if (res3.ok) videos = await res3.json();
                            } catch(e3) { /* sem servidor */ }
                        }
                    }
                }
                
                // 3. Complementar com localStorage
                try {
                    const localItems = JSON.parse(localStorage.getItem('prgilbertopenido_videos') || '[]');
                    if (localItems.length > 0) {
                        const existingIds = new Set(videos.map(v => String(v.id)));
                        const localMapped = localItems
                            .filter(item => !existingIds.has(String(item.id)))
                            .map(item => ({
                                id: item.id, title: item.title, category: item.category,
                                author: item.author || 'Pr. Gilberto Penido Bertho',
                                youtube_url: item.contentUrl, cover_url: item.coverUrl,
                                coverUrl: item.coverUrl, contentUrl: item.contentUrl
                            }));
                        videos = [...videos, ...localMapped];
                    }
                } catch(e) {}

                // 4. Filtrar itens deletados (Vercel bypass)
                try {
                    const deletedIds = JSON.parse(localStorage.getItem('prgilbertopenido_deleted') || '[]');
                    if (deletedIds.length > 0) {
                        videos = videos.filter(v => !deletedIds.includes(String(v.id)));
                    }
                } catch(e) {}

                displayVideos(videos);
            } catch (err) {
                console.error('Erro ao carregar vídeos:', err);
            }
        }

        async function deleteVideo(id, event) {
            if (event) event.stopPropagation();
            if (!confirm('Tem certeza que deseja excluir este vídeo?')) return;
            
            // Delete from Supabase
            try {
                const supabase = typeof getSupabaseClient === 'function' ? getSupabaseClient() : null;
                if (supabase) {
                    await supabase.from('videos').delete().eq('id', id);
                }
            } catch(e) {
                console.warn('Erro ao deletar do Supabase:', e);
            }

            // Delete from local storage
            try {
                let local = JSON.parse(localStorage.getItem('prgilbertopenido_videos') || '[]');
                const initialLength = local.length;
                local = local.filter(item => String(item.id) !== String(id));
                if (local.length !== initialLength) {
                    localStorage.setItem('prgilbertopenido_videos', JSON.stringify(local));
                }
            } catch(e) {}

            // Marcar como deletado globalmente (para Vercel Read-Only)
            try {
                let deletedIds = JSON.parse(localStorage.getItem('prgilbertopenido_deleted') || '[]');
                if (!deletedIds.includes(String(id))) {
                    deletedIds.push(String(id));
                    localStorage.setItem('prgilbertopenido_deleted', JSON.stringify(deletedIds));
                }
            } catch(e) {}

            try {
                const res = await fetch(`/api/videos/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-api-key': 'prgilbertopenido-secret-key-2024' }
                });
            } catch (err) {
                console.warn('Erro ao excluir do servidor:', err);
            }
            
            // Atualiza UI imediatamente sem precisar recarregar
            videos = videos.filter(v => String(v.id) !== String(id));
            displayVideos(videos);
        }

        function getYoutubeThumbnail(url) {
            if (!url) return '';
            const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(ytRegex);
            if (match && match[1]) {
                return `https://img.youtube.com/vi/${match[1]}/hqdefault.jpg`;
            }
            return '';
        }

        function getFallbackGradient(title) {
            if (!title) return 'linear-gradient(135deg, #1f2937 0%, #111827 100%)';
            let hash = 0;
            for (let i = 0; i < title.length; i++) {
                hash = title.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash % 360);
            return `linear-gradient(135deg, hsl(${hue}, 60%, 20%) 0%, hsl(${hue}, 80%, 10%) 100%)`;
        }

        function displayVideos(videos) {
            // recent list
            recentList.innerHTML = '';
            
            if (videos.length === 0) {
                recentList.innerHTML = '<p style="color:var(--text-soft);font-size:14px;">Nenhum vídeo disponível.</p>';
                return;
            }

            videos.forEach(video => {
                const item = document.createElement('div');
                item.className = 'recent-item';
                item.style.position = 'relative';
                
                const videoUrl = video.contentUrl || video.videoPath || video.youtubeUrl || video.youtube_url;
                let cover = video.coverUrl || video.coverPath;
                
                if (!cover && videoUrl) {
                    cover = getYoutubeThumbnail(videoUrl);
                }
                
                // Set inline style for thumbnail (image or gradient fallback)
                let thumbStyle = '';
                if (cover) {
                    thumbStyle = `background-image:url('${cover}'); background-size: cover; background-position: center;`;
                } else {
                    thumbStyle = `background: ${getFallbackGradient(video.title)}; display: flex; align-items: center; justify-content: center;`;
                }

                item.innerHTML = `
                    <div class="thumb" style="${thumbStyle} cursor:pointer;">
                        ${!cover ? '<i class="fas fa-play" style="color: rgba(255,255,255,0.3); font-size: 24px;"></i>' : ''}
                    </div>
                    <div class="info" style="cursor:pointer; flex: 1;">
                        <h4>${escapeHtml(video.title || 'Untitled')}</h4>
                        <p>${escapeHtml((video.category || '') + ' • ' + (new Date(video.createdAt || Date.now())).toLocaleDateString('pt-BR'))}</p>
                    </div>
                    <button onclick="deleteVideo('${video.id}', event)" title="Excluir vídeo" style="background:transparent; border:none; color:#ff4d4d; font-size:16px; cursor:pointer; padding:8px; opacity:0.8; transition:0.2s;">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                
                const openModal = () => openVideoModal(video.title, video.contentUrl || video.videoPath || video.youtubeUrl);
                item.querySelector('.thumb').addEventListener('click', openModal);
                item.querySelector('.info').addEventListener('click', openModal);
                
                recentList.appendChild(item);
            });
        }

        // small helper to avoid XSS when inserting text
        function escapeHtml(str){
            if(!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Função para converter YouTube URL em Embed URL
        function getEmbedUrl(url) {
            if (!url) return '';
            const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(ytRegex);
            if (match && match[1]) {
                return `https://www.youtube.com/embed/${match[1]}?autoplay=1`;
            }
            return url; // Retorna original se não for youtube
        }

        function openVideoModal(title, url) {
            const modal = document.getElementById('videoModal');
            const titleEl = document.getElementById('videoModalTitle');
            const container = document.getElementById('videoModalContainer');
            
            titleEl.textContent = title || 'Reproduzindo Vídeo';
            container.innerHTML = ''; // Limpa anterior

            if (!url) {
                container.innerHTML = '<p style="color:#fff;text-align:center;padding:40px;">URL de vídeo indisponível.</p>';
            } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
                const embedUrl = getEmbedUrl(url);
                container.innerHTML = `<iframe src="${embedUrl}" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen style="width:100%;height:100%;border-radius:8px;"></iframe>`;
            } else {
                container.innerHTML = `<video src="${url}" controls autoplay style="width:100%;height:100%;border-radius:8px;background:#000;"></video>`;
            }

            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeVideoModal() {
            const modal = document.getElementById('videoModal');
            const container = document.getElementById('videoModalContainer');
            modal.classList.remove('open');
            document.body.style.overflow = '';
            setTimeout(() => { container.innerHTML = ''; }, 300); // Para o áudio/vídeo
        }

        // Load videos on page load
        loadVideos();
    </script>

    <!-- Modal de Vídeo -->
    <div id="videoModal" class="video-modal-overlay" onclick="if(event.target===this)closeVideoModal()">
        <div class="video-modal-box">
            <div class="video-modal-header">
                <h3 id="videoModalTitle" style="color:#fff;margin:0;font-size:18px;"></h3>
                <button class="video-modal-close" onclick="closeVideoModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="video-modal-body" id="videoModalContainer">
                <!-- O iframe ou tag video vai aqui -->
            </div>
        </div>
    </div>

    <style>
        .video-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(4, 8, 22, 0.9);
            backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .video-modal-overlay.open { display: flex; }
        .video-modal-box {
            background: #0b1530;
            border: 1px solid rgba(212,175,55,.2);
            border-radius: 16px;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 32px 80px rgba(0,0,0,.6);
        }
        .video-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .video-modal-close {
            background: transparent;
            border: none;
            color: #b8c5d6;
            font-size: 20px;
            cursor: pointer;
        }
        .video-modal-close:hover { color: var(--gold); }
        .video-modal-body {
            aspect-ratio: 16/9;
            width: 100%;
            padding: 16px;
            box-sizing: border-box;
        }
    </style>
    <script src="script.js"></script>
</body>
</html>
